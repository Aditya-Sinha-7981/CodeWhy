name: tree-sitter wheels

on:
  push:
  workflow_dispatch:

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Check grammar wheels
        run: python scripts/check_wheels.py
      - name: Run extraction tests
        run: python -m pytest tests/test_python_ast.py tests/test_ts_treesitter.py -q
