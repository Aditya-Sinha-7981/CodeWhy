[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "codewhy"
dynamic = ["version"]
description = "Explain a local Python/JS/TS codebase as one paste-ready Markdown file."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aditya Sinha" }, { name = "Sheikh" }, { name = "Shregna" }]
keywords = ["documentation", "codebase", "llm", "markdown", "cli", "ollama", "gemini", "python", "javascript", "typescript"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pathspec>=0.12",
  "pydantic>=2",
  "tree-sitter>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
  "networkx>=3",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-mock>=3",
]

[project.urls]
Homepage = "https://github.com/Aditya-Sinha-7981/CodeWhy"
Source = "https://github.com/Aditya-Sinha-7981/CodeWhy"
Issues = "https://github.com/Aditya-Sinha-7981/CodeWhy/issues"
Changelog = "https://github.com/Aditya-Sinha-7981/CodeWhy/blob/main/CHANGELOG.md"

[project.scripts]
codewhy = "codewhy.cli:app"

[tool.hatch.version]
path = "src/codewhy/__init__.py"

[tool.hatch.build.targets.sdist]
# Source builds and their tests only; team planning material stays in the repository.
include = ["/src", "/tests", "/docs/ARCHITECTURE.md", "/docs/TESTS.md", "/README.md", "/LICENSE", "/CHANGELOG.md", "/codewhy.toml.example"]
exclude = ["__pycache__", "*.pyc"]

[tool.hatch.build.targets.wheel]
packages = ["src/codewhy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
  "live_llm: talks to a real model; skipped unless selected with -m live_llm",
]
